name: Bindings Tests (Rust)
# The Rust crates had no PR-time job at all. release-wrappers.yml's comment
# claims `cargo check` on both crates runs "on every push", and uses that as the
# stated reason publishing may use `--no-verify` — but no workflow in this repo
# ever invoked cargo. Reported alongside #362.
#
# It could not have existed before now: `cargo test -p crispasr` did not run
# unaided, because crispasr-sys emitted its rpath via `cargo:rustc-link-arg`,
# which cargo does not propagate to a DEPENDENT's test binaries. The suite died
# with "Library not loaded: @rpath/libcrispasr". crispasr/build.rs now re-emits
# it, so the suite is runnable and therefore worth gating on.
on:
  push:
    paths:
      - crispasr/**
      - crispasr-sys/**
      - include/**
      - src/crispasr_c_api.cpp
      - src/CMakeLists.txt
      - .github/workflows/bindings-rust.yml
  pull_request:
    paths:
      - crispasr/**
      - crispasr-sys/**
      - include/**
      - src/crispasr_c_api.cpp
      - src/CMakeLists.txt
      - .github/workflows/bindings-rust.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      # Build the C library once and point the sys crate at it, rather than
      # letting build.rs run cmake itself into OUT_DIR — same wall-clock, but the
      # build log is visible when it fails.
      - name: Build libcrispasr
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCRISPASR_BUILD_TESTS=OFF \
            -DCRISPASR_BUILD_EXAMPLES=OFF \
            -DCRISPASR_BUILD_SERVER=OFF \
            -DGGML_CUDA=OFF \
            -DCRISPASR_OPUS_FETCH=ON
          # crispasr-lib, not crispasr: with CRISPASR_BUILD_EXAMPLES=OFF the
          # `crispasr` target does not exist here at all (it is the CLI's
          # OUTPUT_NAME, defined with the examples), and Make fails with
          # "No rule to make target 'crispasr'". crispasr-lib is the shared
          # library the sys crate links.
          cmake --build build -j"$(nproc)" --target crispasr-lib

      - name: cargo check (both crates)
        env:
          CRISPASR_SYS_LIB_DIR: ${{ github.workspace }}/build
        run: |
          cargo check --manifest-path crispasr-sys/Cargo.toml
          cargo check --manifest-path crispasr/Cargo.toml

      # No LD_LIBRARY_PATH here on purpose. Needing it is the bug
      # crispasr/build.rs fixes, so running without it is what proves the fix
      # stays fixed — if the rpath regresses, this step fails to load the
      # library rather than passing quietly.
      - name: cargo test (model-free; gated cases self-skip)
        env:
          CRISPASR_SYS_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --manifest-path crispasr/Cargo.toml
